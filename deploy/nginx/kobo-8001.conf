# WEMA Kobo dashboard — public TLS vhost on :8001 (https://sfuai.ca:8001)
#
# Mounted into the sfuai-web nginx container (C:\repos\web\docker-compose.yml)
# as its own file, alongside the other per-project vhosts:
#
#   volumes:
#     - C:\twx-repos\Kobo\deploy\nginx\kobo-8001.conf:/etc/nginx/conf.d/kobo-8001.conf:ro
#   ports:
#     - "8001:8001"
#
# Upstream is this repo's docker-compose.yml (kobo-wema on host port 28501).
# Verify after any change:  docker exec sfuai-web nginx -t && docker exec sfuai-web nginx -s reload

# Unknown Host / SNI on :8001 is refused without a response.
server {
    listen      8001 ssl default_server;
    listen [::]:8001 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen      8001 ssl;
    listen [::]:8001 ssl;
    http2 on;
    server_name sfuai.ca www.sfuai.ca;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Above Streamlit's server.maxUploadSize (50 MB) so its own error is the one shown.
    client_max_body_size 60m;

    location / {
        proxy_pass http://host.docker.internal:28501;
        proxy_http_version 1.1;

        # Streamlit runs over a WebSocket (/_stcore/stream).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Pinned: Tornado rejects the WebSocket unless Origin matches Host.
        proxy_set_header Host              sfuai.ca:8001;
        proxy_set_header X-Forwarded-Host  sfuai.ca:8001;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        # A dashboard tab left open holds the WebSocket for the whole session.
        proxy_read_timeout    86400s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
    }

    access_log /var/log/nginx/kobo-access.log;
    error_log  /var/log/nginx/kobo-error.log warn;
}
